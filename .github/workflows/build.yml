name: Native GlassSwitchDock

on:
  workflow_dispatch:
    inputs:
      simulator:
        description: Build and run actual-source simulator regression harness
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-26-intel
    timeout-minutes: 60
    env:
      SOURCE_DATE_EPOCH: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select latest installed Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Set up Xcode MetalToolchain and original SDK interface
        id: setup
        run: bash tools/setup-macos.sh
      - name: Portable infrastructure self checks
        id: infra
        run: make infra-check
      - name: Verify actual source and pinned originals
        id: source
        run: make check
      - name: Portable production regression contracts
        if: ${{ success() && hashFiles('tools/test-local.py') != '' }}
        run: python3 tools/test-local.py
      - name: Compile actual-source hooks-free simulator app
        id: smoke
        if: ${{ !cancelled() && inputs.simulator && steps.setup.outcome == 'success' && steps.source.outcome == 'success' }}
        continue-on-error: true
        run: make smoke
      - name: Run simulator regression harness
        id: simulator
        timeout-minutes: 12
        if: ${{ !cancelled() && inputs.simulator && steps.smoke.outcome == 'success' }}
        continue-on-error: true
        run: bash tools/run-ci-simulator.sh
      - name: Build real arm64e RootHide package
        id: arm64e
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.source.outcome == 'success' }}
        continue-on-error: true
        run: make build ARCH=arm64e
      - name: Re-extract final RootHide package and verify native strict signatures
        id: verify
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.source.outcome == 'success' }}
        continue-on-error: true
        run: make verify
      - name: Record every stage outcome before artifact upload
        if: ${{ always() }}
        continue-on-error: true
        env:
          SETUP_RESULT: ${{ steps.setup.outcome }}
          SOURCE_RESULT: ${{ steps.source.outcome }}
          INFRA_RESULT: ${{ steps.infra.outcome }}
          ARM64E_RESULT: ${{ steps.arm64e.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
          SIMULATOR_RESULT: ${{ steps.simulator.outcome }}
          REQUIRE_SIMULATOR: ${{ inputs.simulator }}
        run: python3 tools/ci-result.py
      - name: Upload packages, metadata and all available failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: GlassSwitchDock-native-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            dist/*.deb
            dist/*.sha256
            dist/*.metadata.json
            dist/SHA256SUMS
            evidence/**
            tests/evidence/**
      - name: Require RootHide package and requested simulator verification
        if: ${{ always() }}
        run: python3 tools/ci-result.py --gate
